name: Validate Game KI Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Install minimal smoke-test dependencies
        run: python -m pip install Flask==3.1.1 requests==2.32.4
      - name: Smoke-test editable Roblox place generation
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from app import default_scene, place_xml
          server = "--[[GAME_KI_SERVER_SCRIPT]]\nlocal Players = game:GetService('Players')\n" + ("-- server gameplay logic\n" * 18)
          client = "--[[GAME_KI_CLIENT_SCRIPT]]\nlocal Players = game:GetService('Players')\n" + ("-- client HUD and controls\n" * 18)
          payload = place_xml(server + client, "CI Zombie Survival", default_scene("zombie survival"))
          root = ET.fromstring(payload)
          assert len(root.findall(".//Item[@class='Part']")) >= 20, "Expected visible scene geometry"
          assert len(root.findall(".//ProtectedString[@name='Source']")) == 2, "Expected server and client scripts"
          assert root.find("./Item[@class='Workspace']") is not None
          print("Editable Roblox scene XML contains level geometry and both scripts")
          PY
      - name: Validate Vercel configuration and routes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path("vercel.json").read_text())
          assert "rewrites" not in c, "Catch-all rewrite breaks Flask route dispatch"
          assert "app.py" in c["functions"]
          assert c["functions"]["app.py"]["includeFiles"] == "templates/**"
          assert Path("templates/index.html").exists()
          assert Path("templates/fallback-game.html").exists()
          source = Path("app.py").read_text()
          for route in ('@app.get("/")', '@app.get("/status")', '@app.post("/generate")',
                        '@app.get("/roblox-preview")', '@app.get("/resolve-place")', '@app.post("/publish-generated")', '@app.post("/upload")',
                        '@app.get("/starter-game")'):
              assert route in source, "Missing route: " + route
          print("Vercel config and Flask routes look good")
          PY
      - name: Validate JavaScript syntax in HTML
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          for (const file of ["templates/index.html", "templates/fallback-game.html"]) {
            const html = fs.readFileSync(file, "utf8");
            const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script\s*>/gi)];
            if (!scripts.length) throw new Error(file + ": no inline scripts found");
            scripts.forEach((m, i) => new vm.Script(m[1], { filename: file + "#script-" + i }));
            console.log(file + ": " + scripts.length + " script(s) parse");
          }
          NODE
